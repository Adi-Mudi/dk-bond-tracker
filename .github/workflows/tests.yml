name: tests
on: [push, pull_request]
jobs:
  remote-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.txt
      - run: sudo mkdir -p /mnt/Just_Do_It/02_Devp_Soft/01_Adi-Mudi/04_Bonds/01_excel_dashboard
      - run: sudo ln -sf "$GITHUB_WORKSPACE/v5.5_40L_Project_Tracker.xlsm" /mnt/Just_Do_It/02_Devp_Soft/01_Adi-Mudi/04_Bonds/01_excel_dashboard/v5.5_40L_Project_Tracker.xlsm
      - run: bash scripts/test_remote.sh
