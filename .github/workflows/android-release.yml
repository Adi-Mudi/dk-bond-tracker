name: android-release

on:
  push:
    tags:
      - 'v*'

jobs:
  android-release-apk:
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Decode release keystore
        env:
          DKBT_RELEASE_KEYSTORE_BASE64: ${{ secrets.DKBT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$DKBT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dkbt-release.jks"
          echo "DKBT_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/dkbt-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          DKBT_RELEASE_STORE_PASSWORD: ${{ secrets.DKBT_RELEASE_PASSWORD }}
          DKBT_RELEASE_KEY_PASSWORD: ${{ secrets.DKBT_RELEASE_PASSWORD }}
          DKBT_RELEASE_KEY_ALIAS: ${{ secrets.DKBT_RELEASE_KEY_ALIAS }}
        run: ./gradlew --no-daemon -Pdkbt.buildPython="$(which python3)" :app:assembleRelease

      - name: Require pinned fingerprint
        env:
          DKBT_RELEASE_FINGERPRINT: ${{ secrets.DKBT_RELEASE_FINGERPRINT }}
        run: |
          if [ -z "$DKBT_RELEASE_FINGERPRINT" ]; then
            echo "::error::DKBT_RELEASE_FINGERPRINT is not set - the release guard cannot run on a release tag"
            exit 1
          fi

      - name: Check release signature
        env:
          DKBT_RELEASE_FINGERPRINT: ${{ secrets.DKBT_RELEASE_FINGERPRINT }}
        run: sh scripts/check-release-signature.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
