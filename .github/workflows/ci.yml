name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest
      - name: Run unit tests
        run: python3 -m pytest tests/ -q --ignore=tests/journey --ignore=tests/integration -k 'not test_invariants'

  invariant-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest
      - name: Run invariant tests
        run: python3 -m pytest tests/ -q -k invariant

  integration-test:
    runs-on: ubuntu-latest
    needs: invariant-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest
      - name: Run integration tests
        run: python3 -m pytest tests/integration/ -v

  journey-test:
    runs-on: ubuntu-latest
    needs: integration-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest
      - name: Run journey tests
        run: python3 -m pytest tests/journey/ -v
      - name: Run guard smoke tests
        run: |
          for cmd in stage-format-guard sequence-guard skill-gate rules-gate; do
            if command -v "$cmd" >/dev/null 2>&1; then
              "$cmd" --help
            else
              echo "SKIP $cmd (not on PATH)"
            fi
          done
