<style>
  .confirm-dialog[hidden] { display: none; }
  .confirm-dialog { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.45); }
  .confirm-inner { width: min(28rem, 92vw); max-width: 100%; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: 0 8px 30px var(--shadow-color-strong); }
  .confirm-inner h2 { margin-bottom: 8px; }
  .confirm-inner p { font-size: 13px; margin-bottom: 12px; }
  .confirm-actions { display: flex; gap: 8px; justify-content: flex-end; }
</style>
<div class="confirm-dialog" id="app-confirm" role="alertdialog" aria-modal="true" aria-labelledby="app-confirm-title" aria-describedby="app-confirm-body" hidden>
  <div class="confirm-inner">
    <h2 id="app-confirm-title"></h2>
    <p id="app-confirm-body"></p>
    <div class="confirm-actions">
      <button type="button" class="ui-btn ui-btn-text ui-btn-compact" id="app-confirm-cancel">Cancel</button>
      <button type="button" class="ui-btn ui-btn-primary ui-btn-compact" id="app-confirm-accept">Refresh anyway</button>
    </div>
  </div>
</div>
<script>
(function () {
  var dialog = document.getElementById("app-confirm");
  var title = document.getElementById("app-confirm-title");
  var body = document.getElementById("app-confirm-body");
  var cancel = document.getElementById("app-confirm-cancel");
  var accept = document.getElementById("app-confirm-accept");
  if (!dialog || !title || !body || !cancel || !accept) {
    return;
  }
  var pending = null;
  function closeDialog() {
    if (window.closeAppConfirm()) {
      window.releaseOverlay();
    }
  }
  window.closeAppConfirm = function () {
    if (dialog.hidden) {
      return false;
    }
    dialog.hidden = true;
    pending = null;
    return true;
  };
  window.appConfirm = function (message, onAccept) {
    pending = onAccept;
    title.textContent = "Refresh bond facts";
    body.textContent = message;
    dialog.hidden = false;
    window.openOverlay();
    cancel.focus();
  };
  cancel.addEventListener("click", closeDialog);
  dialog.addEventListener("click", function (event) {
    if (event.target === dialog) {
      closeDialog();
    }
  });
  accept.addEventListener("click", function () {
    var next = pending;
    closeDialog();
    if (next) {
      next();
    }
  });
})();
</script>
