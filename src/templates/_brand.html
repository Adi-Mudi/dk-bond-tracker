{%- macro brand_head() -%}
<link rel="icon" type="image/svg+xml" href="/static/img/logo/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/logo/favicon-32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/logo/apple-touch-icon-180.png?v=2">
<link rel="manifest" href="/static/site.webmanifest?v=2">
{%- endmacro -%}
{%- macro brand_mark(size=24) -%}
<img class="brand-mark" src="/static/img/logo/logo-mark.svg?v=2" alt="" width="{{ size }}" height="{{ size }}">
{%- endmacro -%}
{%- macro brand_avatar(size=48) -%}
<img class="about-avatar" id="about-avatar" src="/static/img/logo/logo-512.png?v=2" alt="DK Bond Tracker logo" width="{{ size }}" height="{{ size }}" style="border-radius:10px">
{%- endmacro -%}
