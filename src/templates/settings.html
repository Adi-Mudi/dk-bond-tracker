{% extends "base.html" %}
{% block content %}
<h1>Settings</h1>
<div class="card">
  <h2>Appearance</h2>
  <label class="check-row"><input type="radio" name="theme-choice" data-theme-value="system" checked> System (follow OS)</label>
  <label class="check-row"><input type="radio" name="theme-choice" data-theme-value="light"> Light (default)</label>
  <label class="check-row"><input type="radio" name="theme-choice" data-theme-value="dark"> Dark</label>
  <p class="caption">Theme is saved on this device.</p>
</div>
{% endblock %}
