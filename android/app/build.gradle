plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def buildPythonPath = providers.gradleProperty('dkbt.buildPython')
        .getOrElse('/home/divakaran/.local/share/uv/python/cpython-3.13-linux-x86_64-gnu/bin/python3.13')

android {
    namespace 'com.dkbondtracker.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.dkbondtracker.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        buildPython(buildPythonPath)
        pip {
            install("flask")
        }
    }
}
